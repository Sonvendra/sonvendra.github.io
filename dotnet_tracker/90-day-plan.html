      <section class="noscript-fallback" aria-label="Plan summary">
        <h2>90-Day .NET Full Stack Roadmap (12 weeks)</h2>
        <p>This interactive plan needs JavaScript enabled to track progress. Here is the full curriculum:</p>
        <ol>
          <li><strong>Week 1 — .NET &amp; C# Foundations:</strong> introduction to .NET, comparison to other technologies, .NET Framework architecture (CLR, DLR, CTS, MSIL, PE file, JIT, Reflection, GC, assemblies), C# language overview, namespaces, command line tools and arguments, variables, data types, operators, type conversions, boxing/unboxing, access modifiers, conditional/looping/unconditional branching.</li>
          <li><strong>Week 2 — Arrays, Methods &amp; OOP Basics:</strong> single/multi/jagged arrays, arrays as collections, methods, method overloading, static members, parameter passing (ref/out/params), constants and readonly, classes, constructors, destructors, properties, indexers, auto-implemented properties, encapsulation.</li>
          <li><strong>Week 3 — Advanced OOP:</strong> inheritance, method overriding, polymorphism, abstract classes, sealed classes, interfaces, operator overloading, employee and bank system projects.</li>
          <li><strong>Week 4 — Collections, Generics, Strings &amp; LINQ:</strong> ArrayList, HashTable, Dictionary, Stack, Queue, generics and lists, generic interfaces, generic constraints, custom generic collection classes, String and StringBuilder, anonymous types, LINQ queries, filtering, ordering, aggregation, inserts/deletes/updates, LINQ transformations.</li>
          <li><strong>Week 5 — Exceptions, Delegates, Events, Async &amp; C# 4+ Features:</strong> exception fundamentals, structured exception handling, user-defined exceptions, inner exceptions, delegates, anonymous methods, lambda expressions, events, async/await, asynchronous programming keywords, dynamic data type, named &amp; optional arguments, variance in generic interfaces, automating Office.</li>
          <li><strong>Week 6 — File I/O, Serialization, XML &amp; GUI:</strong> Directory and File classes, FileStream, TextReader/Writer, BinaryReader/Writer, MemoryStream, serialization, XPS to bitmap, XML namespaces and classes, XmlReader, XmlWriter, .NET DOM parser, XML serialization, XPath, XSLT, LINQ to XML, XML and the web, Windows Forms controls, dialog boxes, menus, progress bar, tree view, MDI forms.</li>
          <li><strong>Week 7 — ADO.NET &amp; Entity Framework Core:</strong> ADO.NET architecture, advantages over ADO/OLEDB, connected vs disconnected access, providers (SQL Server, OLEDB, ODBC, Oracle), Connection, Command, DataReader, DataAdapter, DataSet, stored procedures, multiple result sets, table schema, XML and ADO.NET, EF Core DbContext, migrations, CRUD, relationships.</li>
          <li><strong>Week 8 — ASP.NET Core Web API:</strong> Web API project, controllers, routing, GET/POST/PUT/DELETE endpoints, dependency injection, middleware, configuration, repository pattern, service layer, DTOs, validation, logging, global error handling.</li>
          <li><strong>Week 9 — Authentication &amp; Angular Integration:</strong> auth basics, JWT, role-based authorization, secure endpoints, refresh tokens, connecting Angular to the API, services, login UI, route guards, reactive forms, mini full stack app.</li>
          <li><strong>Week 10 — Architecture &amp; Advanced APIs:</strong> layered and clean architecture, CQRS, MediatR, caching, pagination, filtering, API versioning, rate limiting, background jobs, performance optimization.</li>
          <li><strong>Week 11 — Testing &amp; Debugging:</strong> unit testing with xUnit, mocking, integration tests, controller tests, coverage, debugging, diagnostic tools.</li>
          <li><strong>Week 12 — Capstone &amp; Deployment:</strong> full stack capstone project, deployment basics, Azure App Service, CI/CD, resume update, interview prep, mock interviews, final revision.</li>
        </ol>
