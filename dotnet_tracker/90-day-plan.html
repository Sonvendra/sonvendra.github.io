      <section class="noscript-fallback" aria-label="Plan summary">
        <h2>90-Day .NET Full Stack Roadmap (12 weeks)</h2>
        <p>This interactive plan needs JavaScript enabled to track progress. Here is the full curriculum:</p>
        <ol>
          <li><strong>Week 1 — C# Basics:</strong> .NET SDK setup, variables, operators, control flow, loops, methods, arrays and lists, mini console app.</li>
          <li><strong>Week 2 — Object-Oriented Programming:</strong> classes, encapsulation, inheritance, polymorphism, interfaces, employee and bank system projects.</li>
          <li><strong>Week 3 — Advanced C#:</strong> exception handling, delegates, LINQ, collections, async/await, file handling.</li>
          <li><strong>Week 4 — ASP.NET Core:</strong> Web API project, controllers, routing, GET and POST endpoints, dependency injection, middleware, in-memory CRUD.</li>
          <li><strong>Week 5 — Entity Framework Core:</strong> DbContext, migrations, CRUD with EF Core, relationships, Product API.</li>
          <li><strong>Week 6 — API Structure:</strong> repository pattern, service layer, DTOs, validation, logging, global error handling.</li>
          <li><strong>Week 7 — Authentication:</strong> auth basics, JWT, role-based authorization, securing endpoints, refresh tokens.</li>
          <li><strong>Week 8 — Angular Integration:</strong> connecting Angular to the API, services, login UI, route guards, error handling, full stack mini app.</li>
          <li><strong>Week 9 — Architecture:</strong> layered and clean architecture, folder structure, refactoring, CQRS, MediatR.</li>
          <li><strong>Week 10 — Advanced APIs:</strong> caching, pagination, filtering, API versioning, rate limiting, background jobs, performance optimization.</li>
          <li><strong>Week 11 — Testing:</strong> unit testing with xUnit, mocking, integration tests, controller tests, coverage, debugging.</li>
          <li><strong>Week 12 — Final Phase:</strong> capstone full stack project, Azure deployment, CI/CD, resume update, mock interviews, final revision.</li>
        </ol>
      </section>
